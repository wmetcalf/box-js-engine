[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boxjs-engine"
version = "0.1.0"
description = "blastbox engine for box-js — sandboxed JScript/JS emulation with sealed IOC provenance"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["blastbox"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
