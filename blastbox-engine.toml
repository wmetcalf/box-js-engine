# Engine output contract for `boxjs` (schema blastbox-engine-contract/1).
# Describes what src/boxjs_engine/engine.py emits TODAY.
# Validate: python -m blastbox.contract.engine_contract validate blastbox-engine.toml
schema = "blastbox-engine-contract/1"

[engine]
name = "boxjs"
# No vbs: box-js has no VBScript interpreter (a .vbs input fails to parse and yields nothing).
formats = ["js", "jse", "wsf", "wsh", "hta"]
# Built to run offline (--fake-download). See gap egress-mode for Limits.net_egress.
network = ["none"]
# No input cap in the engine; the worker's Limits apply.
statuses = ["ok", "engine_error"]

# Everything lives under `<sample name>.results/`, box-js's own output directory. The analysis
# files are declared first (one refused for budget is warned `artifacts_truncated`); then every
# other top-level file there, smallest first, as `snippet` (box-js's saved code) or `dropped`.
# Count and bytes are bounded by the worker's Limits (max_artifacts, default 1000;
# max_artifact_bytes, default 50 MiB, over which a file is warned `artifact_too_large` and not
# declared; max_total_artifact_bytes), not by constants in the engine.

[[artifacts]]
id = "IOC.json"
path = "*.results/IOC.json"
kind = "analysis"
role = "ioc_report"
description = "box-js IOC list: [{type, value, description}], type is box-js's own IOC name (Run, FileWrite, UrlFetch, ...). Written on the first logged IOC (box-js always logs Sample Name), so absent only when box-js logged nothing or the file was over budget."

[[artifacts]]
id = "urls.json"
path = "*.results/urls.json"
kind = "analysis"
role = "url_list"
description = "Unique URLs the sample touched, a JSON list of strings. Absent when it touched none."

[[artifacts]]
id = "snippets.json"
path = "*.results/snippets.json"
kind = "analysis"
role = "snippet_index"
description = "Index of code snippets (eval'd JS, WScript commands); the bodies are declared as `snippet`. Upstream box-js keys it by snippet file name; the pinned fork serializes it as a list of nulls (see gap fork-index-files-null)."

[[artifacts]]
id = "resources.json"
path = "*.results/resources.json"
kind = "analysis"
role = "resource_index"
description = "Index of resources the sample wrote (emulated path, type, hashes) keyed by the uuid file name declared as `dropped`. The pinned fork serializes it as a list of nulls; NewResource IOCs in IOC.json carry the same records."

[[artifacts]]
id = "active_urls.json"
path = "*.results/active_urls.json"
kind = "analysis"
role = "active_url_list"
description = "JSON list of URLs box-js judged live: the URL fetched last before the sample saved a file that `file` calls executable. Written only then, so usually absent offline (--fake-download bodies are rarely executables)."

[[artifacts]]
id = "env_vars.json"
path = "*.results/env_vars.json"
kind = "analysis"
role = "env_var_map"
description = "Environment variables the sample set, {name: value}. Absent when it set none."

[[artifacts]]
id = "analysis.log"
path = "*.results/analysis.log"
kind = "analysis"
role = "log"
description = "box-js's analysis log."

[[artifacts]]
id = "*"
path = "*.results/*"
kind = "snippet"
max_count = 1000
role = "code_snippet"
description = "Code box-js saved, not a file the sample wrote: eval'd JS as <uuid>.js (lib.logJS; the first is the whole prepared sample) and each command passed to WScript.Shell Run as a bare <uuid> holding the command text verbatim (matched to its Run IOC), plus any name snippets.json keys. max_count is Limits.max_artifacts' default."

[[artifacts]]
id = "*"
path = "*.results/*"
kind = "dropped"
max_count = 1000
role = "recovered_file"
description = "Every other top-level file in the results dir: files the sample wrote (bare <uuid> names, see the NewResource IOCs), downloaded (<sha256>_<name>) or decoded payloads. max_count is Limits.max_artifacts' default."

[payload]
# ok: Record{schema_version, exit_code, killed, net_egress, results_dir, ioc_count, exec_iocs,
#     write_iocs, url_iocs, url_count}. engine_error: Record{schema_version, error, ...}
#     (box_js_missing, node_missing, no_results_dir with exit_code + stderr_tail).
root = "record"
node_types = ["record"]
schema_version = "boxjs.result/1"
required_root_fields = ["schema_version", "exit_code", "killed", "net_egress", "results_dir", "ioc_count",
                        "exec_iocs", "write_iocs", "url_iocs", "url_count"]

# No [[detections]]: the payload carries counts only, and Loadout turns nothing from this
# engine into a detection (engines.py maps boxjs to dets=[]). See gap no-finding-codes.

[[gaps]]
id = "no-finding-codes"
description = "Findings exist only inside the IOC.json artifact as box-js IOC type names plus free-text descriptions; the payload has counts (exec/write/url IOC families) but no stable finding codes or severities."

[[gaps]]
id = "fork-index-files-null"
description = "The pinned box-js fork's simpleStringify writes the name-keyed maps snippets.json and resources.json as lists of nulls, and resources.json is written before the newest resource is recorded, so it lags one entry behind. The engine recognises snippets without them (see the snippet artifact), but a consumer gets no per-resource index; the NewResource IOCs in IOC.json carry the same records. Fixed in the fork by https://github.com/wmetcalf/box-js/pull/1 (lib.js); this gap closes when the box-js submodule is bumped past that merge."

[[gaps]]
id = "killed-is-ok"
description = "A run killed at the wall clock (Limits.timeout_s + 10) whose results dir exists is status ok with killed=true and warning timeout; a nonzero box-js exit_code is ok too. The results are partial."

[[gaps]]
id = "egress-mode"
description = "With Limits.net_egress set the engine passes --download and box-js fetches next stages for real; the payload's net_egress records which mode ran. The contract lists only `none` because that is how it is built and deployed."

[[gaps]]
id = "loadout-caps-refuse-whole-result"
description = "Loadout's boxjs.map_outputs refuses the WHOLE result over 128 artifacts, any artifact over 8 MiB, or 32 MiB in total, while the engine bounds only by Limits (defaults 1000 / 50 MiB / 500 MiB) and Loadout sets no Limits: a sample that drops many or large files fails the job instead of being truncated."

[[gaps]]
id = "loadout-requires-ioc-json"
description = "Loadout refuses an ok result with no artifacts or no IOC.json; the engine returns ok without IOC.json when box-js logged nothing or IOC.json was over budget (warning artifact_too_large)."

[[gaps]]
id = "loadout-exec-ioc-subset"
description = "Loadout normalizes commands only from IOC types run/commandexec/wmi.getobject.run/wmi.getobject.create; the engine's exec_iocs also counts createshortcut, task, task path and task arguments, which Loadout keeps only inside the IOC.json report. FileWrite/NewResource IOCs are not mapped (the dropped files are)."

[[gaps]]
id = "loadout-ignores-payload"
description = "Loadout reads no payload field (exit_code, killed, net_egress, counts); a killed run shows only through the generic rule that any warning (including no_observable_behaviour) marks coverage incomplete."

[[gaps]]
id = "loadout-ignores-active-urls"
description = "Loadout parses URLs only from urls.json (http/https with a host); active_urls.json and UrlFetch/XMLHTTP IOC values (value.url) are retained as report files but not normalized. The engine declares active_urls.json whenever box-js writes it (see that artifact for when)."

[[gaps]]
id = "loadout-snippets-unlabelled"
description = "The engine declares box-js's code as kind=snippet and env_vars.json as kind=analysis, so Loadout's map_outputs no longer calls them recovered_file, but it maps every non-dropped kind to analysis_role report; a snippet is not labelled as code the sample executed or ran."

[[gaps]]
id = "loadout-emits-text-message-unproduced"
description = "Loadout's boxjs EngineManifest emits lists text_message, but map_outputs creates only file, script and url artifacts."

[[consumers]]
name = "loadout"
engine = "boxjs"
mapper = "backend/loadout/boxjs.py:map_outputs"
emits = ["file", "script", "url", "text_message"]
